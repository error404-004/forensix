# FORENSIX Configuration Properties
# Core File Integrity & Security Audit Toolkit Settings

# Monitored directory path for baseline and integrity scanning
monitored.directory=./test-dir

# Target log file path for anomaly detection
log.file.path=src/main/resources/sample-logs/sample-auth.log

# Rule 1: Threshold for burst failed logins from the same IP
failed.login.threshold=5
time.window.minutes=5

# Rule 2: Working/Business hours (24-hour HH:mm)
business.hours.start=08:00
business.hours.end=19:00

# Rule 3: Known malicious / threat-intelligence blacklisted IP addresses (comma-separated)
blacklisted.ips=198.51.100.23,203.0.113.88,192.0.2.1

# Rule 4: Suspicious invalid usernames (comma-separated)
suspicious.users=root,admin,guest,oracle,postgres,test

# Background scheduler interval in seconds
scan.interval.seconds=60

# Database file location
database.path=data/forensix.db

# Reports export directory
reports.directory=reports
